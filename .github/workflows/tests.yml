name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.5.x"
  UV_NO_PROGRESS: "1"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Ruff (lint)
        run: uv run ruff check . --output-format=github

      - name: Ruff (format check)
        run: uv run ruff format --check .
        continue-on-error: true

  pytest:
    name: pytest · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    needs: []
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.10"
        include:
          - os: ubuntu-latest
            python: "3.12"
            coverage: true

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Provide dummy config for imports
        shell: bash
        run: |
          if [ ! -f config.py ]; then
            echo "YANDEX_MUSIC_TOKEN = 'ci-dummy'" > config.py
          fi

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: uv run pytest -q

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: >
          uv run pytest -q
          --cov=.
          --cov-report=xml:coverage.xml
          --cov-report=term-missing
          --cov-config=pyproject.toml

      - name: Upload coverage artifact
        if: ${{ matrix.coverage }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  ci:
    name: ci (all green)
    runs-on: ubuntu-latest
    needs: [lint, pytest]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "lint failed"
            exit 1
          fi
          if [ "${{ needs.pytest.result }}" != "success" ]; then
            echo "pytest failed"
            exit 1
          fi
          echo "All checks passed."